[tool.poetry]
name = "sales-data-processor"
version = "0.1.0"
description = "High-performance CSV processing service with gRPC"
authors = ["Zelalem Wubet <zelalemwubet93@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}, {include = "proto"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
grpcio = "^1.59.3"
grpcio-tools = "^1.59.3"
pandas = "^2.1.3"
python-multipart = "^0.0.6"
python-jose = "^3.3.0"
passlib = "^1.7.4"
bcrypt = "^4.0.1"
redis = "^5.0.1"
celery = "^5.3.4"
psutil = "^5.9.6"
aiofiles = "^23.2.1"
python-dotenv = "^1.0.0"
structlog = "^23.2.0"
grpcio-reflection = "^1.76.0"
protobuf = "^6.33.0"
pydantic-settings = "^2.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.11.0"
isort = "^5.13.2"
flake8 = "^6.1.0"
mypy = "^1.7.1"
pre-commit = "^3.5.0"
httpx = "^0.25.2"
faker = "^19.6.2"

[build-system]
requires = ["poetry-core"]
build-backup = ["poetry-core.masonry.api"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"