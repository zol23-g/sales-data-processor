syntax = "proto3";

package sales_data;

service SalesDataProcessor {
  rpc ProcessSalesData(stream SalesDataChunk) returns (ProcessResponse);
  rpc GetJobStatus(JobStatusRequest) returns (JobStatusResponse);
  rpc DownloadResult(DownloadRequest) returns (DownloadResponse);
}

message SalesDataChunk {
  string job_id = 1;
  bytes chunk_data = 2;
  string filename = 3;
}

message ProcessResponse {
  string job_id = 1;
  string status = 2;
  string message = 3;
  string download_url = 4;
  int32 total_rows = 5;
  int32 total_departments = 6;
  double processing_time = 7;
}

message JobStatusRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string status = 2;
  string message = 3;
  int32 progress = 4;
  string download_url = 5;
}

message DownloadRequest {
  string job_id = 1;
}

message DownloadResponse {
  string download_url = 1;
  string filename = 2;
  int64 file_size = 3;
}